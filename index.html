<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPOVIBE — Your Sound. Your Vibe.</title>
  <meta name="description" content="SPOVIBE is a premium music discovery and streaming platform." />
  <meta http-equiv="refresh" content="2;url=http://localhost:3000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0A0A0A;
      color: #F5ECD7;
      font-family: 'Outfit', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      overflow: hidden;
      position: relative;
    }

    /* Background glow */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(61,26,13,0.25) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Logo SVG wrapper */
    .logo-wrap {
      animation: floatUp 0.8s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    .logo-text {
      font-size: clamp(48px, 10vw, 96px);
      font-weight: 900;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #C9A84C 0%, #E2C36A 50%, #A0724A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .tagline {
      font-size: clamp(14px, 2.5vw, 18px);
      color: rgba(245,236,215,0.45);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 400;
      animation: floatUp 0.8s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    /* Animated soundwave rings */
    .rings {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatUp 0.8s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(201,168,76,0.5);
      animation: ringPulse 2s ease-in-out infinite;
    }
    .ring:nth-child(1) { width: 28px; height: 28px; animation-delay: 0s; border-color: rgba(201,168,76,0.9); }
    .ring:nth-child(2) { width: 44px; height: 44px; animation-delay: 0.3s; border-color: rgba(201,168,76,0.5); }
    .ring:nth-child(3) { width: 60px; height: 60px; animation-delay: 0.6s; border-color: rgba(201,168,76,0.25); }
    .ring:nth-child(4) { width: 76px; height: 76px; animation-delay: 0.9s; border-color: rgba(201,168,76,0.1); }
    .ring-center {
      width: 12px; height: 12px;
      background: linear-gradient(135deg, #C9A84C, #E2C36A);
      border-radius: 50%;
      position: relative;
      z-index: 1;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.7; }
    }

    /* Loading bar */
    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: floatUp 0.8s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .loading-bar {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
    }
    .loading-fill {
      height: 100%;
      background: linear-gradient(90deg, #C9A84C, #E2C36A, #A0724A);
      border-radius: 999px;
      animation: loadBar 2s ease forwards;
    }
    @keyframes loadBar {
      from { width: 0%; }
      to { width: 100%; }
    }
    .loading-text {
      font-size: 12px;
      color: rgba(245,236,215,0.3);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* Open button */
    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #C9A84C, #E2C36A);
      color: #0A0A0A;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
      box-shadow: 0 0 30px rgba(201,168,76,0.2);
      animation: floatUp 0.8s 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .open-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(201,168,76,0.35);
    }

    /* Waveform bars at the bottom */
    .waveform {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 32px;
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      animation: floatUp 0.8s 0.5s both;
    }
    .waveform-bar {
      width: 4px;
      background: linear-gradient(180deg, #C9A84C, #A0724A);
      border-radius: 2px;
      animation: waveBounce 1.2s ease-in-out infinite;
    }
    .waveform-bar:nth-child(1)  { height: 35%; animation-delay: 0.0s; }
    .waveform-bar:nth-child(2)  { height: 65%; animation-delay: 0.1s; }
    .waveform-bar:nth-child(3)  { height: 100%; animation-delay: 0.2s; }
    .waveform-bar:nth-child(4)  { height: 55%; animation-delay: 0.3s; }
    .waveform-bar:nth-child(5)  { height: 80%; animation-delay: 0.4s; }
    .waveform-bar:nth-child(6)  { height: 40%; animation-delay: 0.5s; }
    .waveform-bar:nth-child(7)  { height: 70%; animation-delay: 0.6s; }
    .waveform-bar:nth-child(8)  { height: 50%; animation-delay: 0.7s; }
    .waveform-bar:nth-child(9)  { height: 90%; animation-delay: 0.8s; }
    .waveform-bar:nth-child(10) { height: 45%; animation-delay: 0.9s; }
    .waveform-bar:nth-child(11) { height: 75%; animation-delay: 1.0s; }
    .waveform-bar:nth-child(12) { height: 35%; animation-delay: 1.1s; }

    @keyframes waveBounce {
      0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    @keyframes floatUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Soundwave icon -->
  <div class="rings">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring-center"></div>
  </div>

  <!-- Wordmark -->
  <div class="logo-wrap">
    <div class="logo-text">SPOVIBE</div>
  </div>

  <!-- Tagline -->
  <div class="tagline">Your Sound. Your Vibe.</div>

  <!-- Loading bar (auto-redirect happens in 2s) -->
  <div class="loading-wrap">
    <div class="loading-bar">
      <div class="loading-fill"></div>
    </div>
    <div class="loading-text">Launching app&hellip;</div>
  </div>

  <!-- Manual open button (fallback) -->
  <a class="open-btn" href="http://localhost:3000" id="open-app-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <polygon points="5 3 19 12 5 21 5 3"/>
    </svg>
    Open SPOVIBE
  </a>

  <!-- Animated waveform footer -->
  <div class="waveform" aria-hidden="true">
    <div class="waveform-bar"></div>
    <div class="waveform-bar"></div>
    <div class="waveform-bar"></div>
    <div class="waveform-bar"></div>
    <div class="waveform-bar"></div>
    <div class="waveform-bar"></div>
    <div class="waveform-bar"></div>
    <div class="waveform-bar"></div>
    <div class="waveform-bar"></div>
    <div class="waveform-bar"></div>
    <div class="waveform-bar"></div>
    <div class="waveform-bar"></div>
  </div>

  <script>
    // Auto-redirect after 2 seconds
    setTimeout(function () {
      window.location.href = 'http://localhost:3000';
    }, 2000);
  </script>
</body>
</html>
